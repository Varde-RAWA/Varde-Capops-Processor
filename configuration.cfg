[grid]
minLat=59.0
maxLat=61.0
minLon=3.0
maxLon=7.0
cellSizeDeg=0.4
coordinateSystem=WGS84

[protobufVersion]
version=3

[redis]
# For a processor container on the same Docker network as Redis:
redisUrl=tcp://localhost:6379?connect_timeout=1000ms&socket_timeout=2000ms
redisChannel=flightdata

[zones]
source=file # file/api. Choose file for local GeoJSON files or api for the Geo Service API.
apiUrl=http://localhost:5040/collections/restricted-areas/items
file=data/zones.geojson
avoidanceApiUrl=http://localhost:5040/collections/avoidance-areas/items
avoidanceFile=data/avoidance-areas.geojson
refreshSeconds=30

[dataSource]
type=sim  # sim/api. Choose sim for local scenario files or api for the OpenSky API.

[simulation]
scenarioFiles=scenarios/S1.geojson
timestepSize=0.5

[execution]
loopIntervalMs=1000 # Use a longer request interval for the OpenSky API to avoid exceeding rate limits
