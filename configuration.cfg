[grid]
minLat=59.0
maxLat=61.0
minLon=3.0
maxLon=7.0
cellSizeDeg=0.4
coordinateSystem=WGS84

[protobufVersion]
version=3

[redis]
# For a processor container on the same Docker network as Redis:
#redisUrl=tcp://redis:6379?connect_timeout=200ms&socket_timeout=200ms
redisUrl=tcp://localhost:6379?connect_timeout=200ms&socket_timeout=200ms
redisChannel=flightdata

[zones]
source=api
apiUrl=http://localhost:5040/collections/restricted-areas/items
file=data/zones.geojson
avoidanceApiUrl=http://localhost:5040/collections/avoidance-areas/items
avoidanceFile=data/avoidance-areas.geojson
refreshSeconds=30

[dataSource]
type=sim  #choose between sim and api 

[simulation]  #if type=sim
numFlights=15
timestepSize=0.5

[execution]
loopIntervalMs=500
