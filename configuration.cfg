[grid]
minLat=59.0
maxLat=61.0
minLon=3.0
maxLon=7.0
cellSizeDeg=0.4
coordinateSystem=WGS84

[protobufVersion]
version=3

[redis]
#redisUrl=tcp://redis-server:6379
redisUrl=tcp://localhost:6379
redisChannel=flightdata

[zones]
source=api
apiUrl=http://localhost:5040/collections/restricted-areas/items
file=data/zones.geojson
refreshSeconds=30

[dataSource]
type=sim  #choose between sim and api 

[simulation]  #if type=sim
numFlights=15
timestepSize=0.5

[execution]
loopIntervalMs=500